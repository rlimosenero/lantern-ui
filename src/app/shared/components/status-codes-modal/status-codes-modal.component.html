<div class="overlay" *ngIf="config">
  <div class="modal">

    <!-- HEADER -->
    <div class="header">
      <h2>Response Codes</h2>
      <button (click)="close()">
        <img class="icon-tbl" src="assets/icons/close.png" />
      </button>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width:100px;">Actions</th>
            <th>Business Code</th>
            <th>HTTP Code</th>
            <th>Message</th>
            <th>Type</th>
            <th>Suggested Action</th>
          </tr>
        </thead>

        <tbody>

          <!-- EXISTING ROWS -->
          <tr *ngFor="let row of rows; let i = index" [class.deleted]="deletedIndexes.has(i)">

            <!-- EDIT MODE -->
            <ng-container *ngIf="editingIndex === i; else viewMode">

              <td class="actions">
                <button (click)="saveRow()"><img class="icon-tbl" src="assets/icons/check.png" /></button>
                <button (click)="cancelEdit()"><img class="icon-tbl" src="assets/icons/close.png" /></button>
              </td>

              <td><input [(ngModel)]="form.businessCode" /></td>
              <td><input [(ngModel)]="form.httpcode" /></td>
              <td><input [(ngModel)]="form.message" /></td>
              <td><input [(ngModel)]="form.type" /></td>
              <td><input [(ngModel)]="form.suggestedAction" /></td>

            </ng-container>

            <!-- VIEW MODE -->
            <ng-template #viewMode>

              <td class="actions">

                <ng-container *ngIf="!deletedIndexes.has(i); else deletedActions">

                  <button (click)="editRow(row, i)" [disabled]="isEditing()">
                    <img class="icon-tbl" src="assets/icons/edit.png" />
                  </button>

                  <button (click)="markDelete(i)" [disabled]="isEditing()">
                    <img class="icon-tbl" src="assets/icons/delete.png" />
                  </button>

                </ng-container>

                <ng-template #deletedActions>
                  <button (click)="undoDelete(i)">
                    <img class="icon-tbl" src="assets/icons/undo.png" />
                  </button>
                </ng-template>

              </td>

              <td>{{ row.businessCode }}</td>
              <td>{{ row.httpcode }}</td>
              <td class="ellipsis">{{ row.message }}</td>
              <td>{{ row.type }}</td>
              <td>{{ row.suggestedAction }}</td>

            </ng-template>

          </tr>

          <!-- ADD ROW -->
          <tr *ngIf="editingIndex === -1" class="new-row">

            <td class="actions">
              <button (click)="saveRow()"><img class="icon-tbl" src="assets/icons/check.png" /></button>
              <button (click)="cancelEdit()"><img class="icon-tbl" src="assets/icons/close.png" /></button>
            </td>

            <td><input [(ngModel)]="form.businessCode" /></td>
            <td><input [(ngModel)]="form.httpcode" /></td>
            <td><input [(ngModel)]="form.message" /></td>
            <td><input [(ngModel)]="form.type" /></td>
            <td><input [(ngModel)]="form.suggestedAction" /></td>

          </tr>

        </tbody>
      </table>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <app-button name="+ Add" (click)="addRow()" [disabled]="isEditing()" />
      <app-button name="Save" (click)="submit()" [disabled]="!hasChanges() || isEditing()" />
    </div>

  </div>
</div>
