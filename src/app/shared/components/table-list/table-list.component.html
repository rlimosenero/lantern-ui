@if (tableList.length > 0) {
  
  <table mat-table [dataSource]="tableList" class="mat-elevation-z0 lantern-table">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Application Name </th>
      <td mat-cell *matCellDef="let list">
        {{list.name}}
      </td>
    </ng-container>

    <ng-container matColumnDef="desc">
      <th mat-header-cell *matHeaderCellDef> Description </th>
      <td mat-cell *matCellDef="let list">
        {{list.description}}
      </td>
    </ng-container>

    <ng-container matColumnDef="version">
      <th mat-header-cell *matHeaderCellDef> Version </th>
      <td mat-cell *matCellDef="let list">
        {{list.version}}
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let list">
        <span class="status-pill" [ngClass]="{
          'active': list.status === 'ACTIVE',
          'for-deprecation': list.status === 'FOR DEPRECATION',
          'deprecated': list.status === 'DEPRECATED',
          'for-retirement': list.status === 'FOR RETIREMENT'
        }">
          {{list.status | lowercase | titlecase }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="options">
      <th mat-header-cell *matHeaderCellDef> Options </th>
      <td mat-cell *matCellDef="let list; index as i">
        <button mat-icon-button color="primary">
          <mat-icon>visibility</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

}
