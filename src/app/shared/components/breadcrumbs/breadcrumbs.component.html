<section class="breadcrumbs">
  <nav class="breadcrumb-nav">
    <ol class="breadcrumb-list">
      @for (bc of (breadcrumbs$ | async); track bc.url; let last = $last) {
      <li class="breadcrumb-item" [class.last]="last">
        @if (!last) {
          <a [routerLink]="bc.url" class="bc-link">{{ bc.label }}</a>
        } @else {
          <span class="active">{{ bc.label }}</span>
        }
      </li>
      }
    </ol>
  </nav>
</section>
