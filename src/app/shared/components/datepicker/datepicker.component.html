<div class="custom-datepicker">

  <!-- INPUT DISPLAY -->
  <div
    class="date-input"
    [class.disabled]="disabled"
    (click)="togglePicker()">

    {{ displayValue || placeholder }}

  </div>

  <!-- EXPANDED PICKER -->
  <div
    class="picker-panel"
    *ngIf="isOpen">

    <div class="picker-grid">

      <!-- MONTH -->
      <div class="form-group">

        <label>Month</label>

        <select
          class="custom-dropdown"
          [(ngModel)]="selectedMonth"
          (ngModelChange)="onMonthChange()">

          <option [ngValue]="null">
            MM
          </option>

          <option
            *ngFor="let month of months; let i = index"
            [ngValue]="i">

            {{ month }}

          </option>

        </select>

      </div>

      <!-- DAY -->
      <div class="form-group">

        <label>Day</label>

        <select
          class="custom-dropdown"
          [(ngModel)]="selectedDay"
          [disabled]="selectedMonth === null"
          (ngModelChange)="onDayChange()">

          <option [ngValue]="null">
            dd
          </option>

          <option
            *ngFor="let day of days"
            [ngValue]="day">

            {{ day }}

          </option>

        </select>

      </div>

      <!-- YEAR -->
      <div class="form-group">

        <label>Year</label>

        <select
          class="custom-dropdown"
          [(ngModel)]="selectedYear"
          (ngModelChange)="onYearChange()">

          <option [ngValue]="null">
            yyyy
          </option>

          <option
            *ngFor="let year of years"
            [ngValue]="year">

            {{ year }}

          </option>

        </select>

      </div>

    </div>

    <!-- ACTIONS -->
    <div class="actions">

      <button
        type="button"
        class="confirm-btn"
        [disabled]="!canConfirm()"
        (click)="confirmDate()">

        Confirm

      </button>

    </div>

  </div>

</div>
