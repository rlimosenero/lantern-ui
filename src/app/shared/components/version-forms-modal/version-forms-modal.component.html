<div class="overlay" *ngIf="isOpen">

    <div class="modal-wrapper">

        <div class="modal-container">

            <div class="modal-header">
                <h2>

                    {{ isEditMode
                    ? (versionType==='API'
                    ? 'Edit API Version'
                    : 'Edit Version')
                    : (versionType==='API'
                    ? 'Add API Version'
                    : 'Add Version')
                    }}

                </h2>
            </div>

            <form #versionForm="ngForm">
                <div class="content-body">

                    <section>
                        <h2>Version Information</h2>

                        <div class="grid two" *ngIf="versionType === 'APP'">
                            <div class="form-group">
                                <label>Version Number <span class="required">*</span></label>
                                <input type="text" name="appVersion" [(ngModel)]="payload.appVersion" required
                                    #versionRef="ngModel" placeholder="e.g. 1.0.0" />
                                <div class="error" *ngIf="versionRef.touched && versionRef.invalid">
                                    Version number is required
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Build Version</label>
                                <input type="text" name="buildVersion" [(ngModel)]="payload.buildVersion"
                                    placeholder="e.g. b123" />
                            </div>
                        </div>

                        <div class="grid two" *ngIf="versionType == 'API'">
                            <div class="form-group">
                                <label>App Version<span class="required">*</span></label>
                                <select name="appVersionSelection" [(ngModel)]="selectedAppVersionObj"
                                    (ngModelChange)="onAppVersionChange($event)" class="custom-dropdown" required
                                    #appVerRef="ngModel">

                                    <option [ngValue]="null">Select App Version</option>

                                    <option *ngFor="let opt of dropdownOptions['APP_VERSIONS']" [ngValue]="opt">
                                        {{ opt.version }}
                                    </option>
                                </select>
                                <div class="error" *ngIf="appVerRef.touched && appVerRef.invalid">Required</div>
                            </div>

                            <div class="form-group">
                                <label>API Version Number <span class="required">*</span></label>
                                <input type="text" name="apiVersion" [(ngModel)]="payload.apiVersion" required
                                    #apiVerRef="ngModel" placeholder="e.g. v1" />
                                <div class="error" *ngIf="apiVerRef.touched && apiVerRef.invalid">Required</div>
                            </div>
                        </div>

                        <div class="grid two">
                            <div class="form-group">
                                <label>Release Stage <span class="required">*</span></label>
                                <select name="releaseStage" [(ngModel)]="payload.releaseStage" class="custom-dropdown"
                                    required #stageRef="ngModel">
                                    <option value="">Select Stage</option>
                                    <option *ngFor="let stage of dropdownOptions['RELEASE_STAGE']" [value]="stage.code">
                                        {{ stage.value }}
                                    </option>
                                </select>
                                <div class="error" *ngIf="stageRef.touched && stageRef.invalid">Required</div>
                            </div>

                            <div class="form-group">
                                <label>Environment <span class="required">*</span></label>
                                <select name="environment" [(ngModel)]="payload.environment" class="custom-dropdown"
                                    required #envRef="ngModel">
                                    <option value="">Select Environment</option>
                                    <option *ngFor="let env of dropdownOptions['ENVIRONMENT']" [value]="env.code">
                                        {{ env.value }}
                                    </option>
                                </select>
                                <div class="error" *ngIf="envRef.touched && envRef.invalid">Required</div>
                            </div>
                        </div>

                        <div class="grid two" *ngIf="versionType === 'API'">
                            <div class="form-group">
                                <label>Build Version</label>
                                <input type="text" name="buildVersion" [(ngModel)]="payload.buildVersion"
                                    placeholder="e.g. b123" />
                            </div>
                        </div>
                    </section>

                    <section>
                        <h2>Release Details</h2>

                        <div class="form-group">
                            <label>Features</label>
                            <textarea rows="3" name="features" [(ngModel)]="payload.features"
                                placeholder="Describe new changes..."></textarea>
                        </div>

                        <div class="grid two">
                            <div class="form-group">
                                <label>Developers</label>
                                <input type="text" name="developers" [(ngModel)]="payload.developers"
                                    placeholder="e.g. John Doe" />
                            </div>
                            <div class="form-group">
                                <label>Squad</label>
                                <input type="text" name="devSquad" [(ngModel)]="payload.devSquad"
                                    placeholder="e.g. Alpha" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Docs URL</label>
                            <input type="url" name="docsUrl" [(ngModel)]="payload.docsUrl" placeholder="https://..." />
                        </div>
                    </section>

                </div>

                <div class="actions">

                    <app-button name="Cancel" (click)="closeModal()">
                    </app-button>

                    <app-button [name]="isEditMode ? 'Update':'Save'" (click)="onSave()"
                        [disabled]="isSaveDisabled(versionForm)">
                    </app-button>

                </div>

            </form>

        </div>

    </div>

</div>
