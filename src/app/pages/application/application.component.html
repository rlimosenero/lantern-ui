<div class="page-container">
    <div class="search-container">
  <div class="search-box">
    <mat-icon>search</mat-icon>
    <input type="text" placeholder="Search applications and web services...">
  </div>
</div>
<br>
  <mat-card appearance="outlined">

    <div class="header-container">
  <div class="title-group">
    <h2 class="mat-h2">Applications</h2>
    <p class="app-count">Showing {{ dataSource().length }} items</p>
  </div>

  <span class="spacer"></span>

  <button mat-flat-button class="add-btn">
    <mat-icon>add</mat-icon>
    Add Application
  </button>
</div>

    <mat-table [dataSource]="dataSource()" class="mat-elevation-z0">
      
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Application Name </th>
        <td mat-cell *matCellDef="let service"> {{service.name}} </td>
      </ng-container>
      <ng-container matColumnDef="desc">
        <th mat-header-cell *matHeaderCellDef>  Description </th>
        <td mat-cell *matCellDef="let service"> {{service.desc}} </td>
      </ng-container>
      <ng-container matColumnDef="version">
        <th mat-header-cell *matHeaderCellDef>  Version </th>
        <td mat-cell *matCellDef="let service"> {{service.version}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let service">
          <span class="status-pill" [ngClass]="service.status.toLowerCase()">
            {{service.status}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="options">
        <th mat-header-cell *matHeaderCellDef> Options </th>
        <td mat-cell *matCellDef="let service">
          <button mat-icon-button  color="primary">
            <mat-icon>{{  'visibility' }}</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </mat-table>
  </mat-card>
</div>
