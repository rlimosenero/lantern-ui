<div class="page-container">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Service Catalogue</mat-card-title>
    </mat-card-header>
    
    <mat-table [dataSource]="dataSource()" class="mat-elevation-z0">
      
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Service Name </th>
        <td mat-cell *matCellDef="let service"> {{service.name}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let service">
          <span class="status-pill" [ngClass]="service.status.toLowerCase()">
            {{service.status}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="lastDeployment">
        <th mat-header-cell *matHeaderCellDef> Last Deployment </th>
        <td mat-cell *matCellDef="let service"> {{service.lastDeployment}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let service">
          <button mat-icon-button (click)="toggleService(service.name)" color="primary">
            <mat-icon>{{ service.status === 'Online' ? 'pause_circle' : 'play_circle' }}</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </mat-table>
  </mat-card>
</div>
