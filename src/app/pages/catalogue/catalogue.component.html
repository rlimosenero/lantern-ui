<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Service Catalogue</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Service Name </th>
        <td mat-cell *matCellDef="let service"> {{service.name}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let service">
          <mat-chip-set>
      @if (service.status === 'Online') {
        <mat-chip class="status-online"> {{service.status}} </mat-chip>
      } @else {
        <mat-chip class="status-offline"> {{service.status}} </mat-chip>
      }
    </mat-chip-set>
      
        </td>
      </ng-container>

      <ng-container matColumnDef="deploymentDate">
        <th mat-header-cell *matHeaderCellDef> Last Deployment </th>
        <td mat-cell *matCellDef="let service"> {{service.deploymentDate}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Resources </th>
        <td mat-cell *matCellDef="let service">
          <a mat-stroked-button color="primary" [href]="service.swaggerUrl" target="_blank" rel="noopener">
            <mat-icon>open_in_new</mat-icon>
            Swagger
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
