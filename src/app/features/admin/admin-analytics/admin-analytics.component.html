<div class="page-container" style="padding: 24px;">
  <h1 style="font-weight: 300; margin-bottom: 24px;">System Overview</h1>

  <mat-grid-list cols="3" rowHeight="180px" gutterSize="24px">
    @for (stat of stats(); track stat.title) {
      <mat-grid-tile>
        <mat-card appearance="outlined" class="stat-card" style="width: 100%; height: 100%; border-radius: 12px;">
          <mat-card-content style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;">
            <div style="display: flex; align-items: center; gap: 8px; color: #5f6368;">
              <mat-icon [style.color]="stat.color">{{ stat.icon }}</mat-icon>
              <span style="font-weight: 500;">{{ stat.title }}</span>
            </div>
            <div style="font-size: 3rem; font-weight: 700; margin-top: 8px;">
              {{ stat.value }}
            </div>
          </mat-card-content>
        </mat-card>
      </mat-grid-tile>
    }
  </mat-grid-list>
</div>
